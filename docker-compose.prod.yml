version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: systech-aidd-postgres
    environment:
      POSTGRES_USER: aidd_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidd_password}
      POSTGRES_DB: aidd_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidd_user -d aidd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - systech-network

  migrations:
    image: ghcr.io/alexey39dev/systech-aidd-main-api:latest
    container_name: systech-aidd-migrations
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - systech-network

  bot:
    image: ghcr.io/alexey39dev/systech-aidd-main-bot:latest
    container_name: systech-aidd-bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep python || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - systech-network

  api:
    image: ghcr.io/alexey39dev/systech-aidd-main-api:latest
    container_name: systech-aidd-api
    env_file:
      - .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - systech-network

  frontend:
    image: ghcr.io/alexey39dev/systech-aidd-main-frontend:latest
    container_name: systech-aidd-frontend
    ports:
      - "3002:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://89.223.67.136:8002
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - systech-network

volumes:
  postgres_data:
    driver: local

networks:
  systech-network:
    driver: bridge
